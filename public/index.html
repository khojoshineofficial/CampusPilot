<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusPilot – Login</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,#2563EB,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.2rem;">CP</div>
      <div>
        <h1 style="font-size:1.3rem;font-weight:800;color:#2563EB">CampusPilot</h1>
        <div style="font-size:0.72rem;color:#64748b">Your Smart Campus Companion</div>
      </div>
    </div>

    <span id="authEmoji" class="auth-emoji">😊</span>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@campus.edu" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
        Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.88rem;color:#64748b">
      Don't have an account? <a href="/register.html" style="color:#2563EB;font-weight:600">Register</a>
    </p>

    <div style="text-align:center;margin-top:16px;font-size:0.75rem;color:#94a3b8">
      Demo: admin@campuspilot.com / Admin@123
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
  initTheme();

  // Redirect if already logged in
  const token = localStorage.getItem('cp_token');
  if (token) {
    api.getMe().then(({ user }) => {
      window.location.href = `/${user.role}`;
    }).catch(() => localStorage.removeItem('cp_token'));
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const emoji = document.getElementById('authEmoji');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      const { token, user } = await api.login({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });

      localStorage.setItem('cp_token', token);
      localStorage.setItem('cp_user', JSON.stringify(user));

      emoji.textContent = '😊';
      emoji.classList.add('bounce');
      showToast('Login successful! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = `/${user.role}`;
      }, 800);
    } catch (err) {
      emoji.textContent = '😢';
      emoji.classList.remove('bounce');
      emoji.classList.add('shake');
      setTimeout(() => emoji.classList.remove('shake'), 1200);
      showToast(err.message || 'Login failed. Please check your credentials.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
